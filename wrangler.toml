name = "homepage-sitemap-robots-txt"
main = "index.js"
compatibility_date = "2024-03-27"

# This locks in your routes so GitHub never overwrites them
routes = [
  { pattern = "www.eryc.my.id/*", zone_name = "eryc.my.id" },
  { pattern = "eryc.my.id/*", zone_name = "eryc.my.id" },
  { pattern = "www.eryc.my.id/assets/*", zone_name = "eryc.my.id" }
]

# --- SERVICE BINDING ---
# for WEBMCP AGP VALIDATOR
[[services]]
binding = "EDGE_SEO_WORKER"
service = "edge-seo"

# --- KV BINDING ---
# for WEBMCP GSC PSI LIVE TELEMETRY
[[kv_namespaces]]
binding = "GSC_PSI_EDGE_SEO"
id = "d44101c3a5114dac85b46c9ee74ff573"

# --- R2 ASSET BINDING ---
# This connects your new Edge proxy bucket directly to the Worker
[[r2_buckets]]
binding = "MY_ASSETS"
bucket_name = "eryc-assets"

# --- CRON TRIGGER ---
# This forces Wrangler to keep your 30-minute schedule active
[triggers]
crons = ["*/30 * * * *"]

# --- KV DATABASE BINDING ---
# This ensures GitHub automatically reconnects your KV database on every push
[[kv_namespaces]]
binding = "SEO_PAYLOADS"
id = "4cbae4c8b74246a2b783cb63186e405a"

# Your Asymmetric Ghost Payload memory
[[kv_namespaces]]
binding = "AGP_STATE"
id = "9a9985fe64c34f6ea7eb41de408ccbcd"

# --- AI BOT TRACKING LOGS ---
[observability]
[observability.logs]
enabled = true
# Set this to false so your logs don't get spammed with every single normal user visit. 
# It will ONLY log when your specific console.log() is triggered by an AI bot.
invocation_logs = false
